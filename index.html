<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>D&D's RTT App</title>
  <link rel="canonical" href="https://danddsrtt-app.onrender.com/">
  <!-- JS redirect preserves any ?query and #hash so shared links keep their state.
       The meta-refresh is a no-JS fallback (it can't forward the query string). -->
  <meta http-equiv="refresh" content="0; url=https://danddsrtt-app.onrender.com/">
  <script>
    location.replace("https://danddsrtt-app.onrender.com/" + location.search + location.hash);
  </script>
</head>
<body style="font-family: sans-serif; text-align: center; margin-top: 4rem;">
  <p>Redirecting to <a href="https://danddsrtt-app.onrender.com/">D&amp;D's RTT App</a>&hellip;</p>
  <p style="color:#777; font-size:0.9rem;">If it doesn't open, the app may be waking up
  (first load can take ~1&nbsp;minute on free hosting).</p>
</body>
</html>
